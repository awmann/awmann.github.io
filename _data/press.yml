- id: k233_disc
  toc: Baby Alien Worlds Show Us How to Cook a Planet
  title: Baby Alien Worlds Show Us How to Cook a Planet (K2-33b)
  date: 2016-06
  blurb: >-
    <p><a href="http://www.slate.com/blogs/bad_astronomy/2016/06/21/two_new_planets_show_hot_jupiters_can_migrate_early.html">This article</a>
    from the bad astronomy blog does a good job explaining why K2-33b is important. You can also check out the
    <a href="https://mcdonaldobservatory.org/news/releases/20160620">UT</a>, <a href="https://www.noao.edu/news/2016/pr1602.php">NOAO</a>,
    and <a href="https://www.cfa.harvard.edu/news/2016-14">CfA</a> press releases.</p>
  media:
    - video: video/K2-33b Animation-720p.m4v
      poster: video/K2-33b Animation-720p_poster.jpg
      alt: Animation of the planet K2-33b transiting its young star, which is surrounded by a debris disk
      width: 640
      caption: "When a planet such as K2-33b passes in front of its host star, it blocks some of the star's light. Observing this periodic dimming, called a transit, from continual monitoring of a star's brightness, allows astronomers to detect planets outside our solar system with a high degree of certainty. This Neptune-sized planet orbits a star that is approximately 11 million years old. In addition to the planet, the star hosts a disk of planetary debris, seen as a bright ring encircling the star. Animation credit: NASA/JPL-Caltech"
    - src: img/k2_33art.jpg
      alt: Artist's illustration of K2-33b passing in front of its young star
      width: 700
      caption: "Artist rendition of the K2-33 system. Image credit: NASA/JPL-Caltech"
    - src: img/k2_33dia.jpg
      alt: Diagram comparing the size of the K2-33 system with the orbits of Mercury and the Sun
      width: 700
      caption: "This image shows the K2-33 system, and its planet K2-33b, compared to our own solar system. The planet has a five-day orbit, whereas Mercury orbits our sun in 88 days. The planet is also nearly 10 times closer to its star than Mercury is to the sun. Image credit: NASA/JPL-Caltech"
    - src: img/UpperSco_K2-33.jpg
      alt: Digitized Sky Survey image of the Upper Scorpius region with Nu Scorpii, Beta Scorpii, and an inset around K2-33
      width: 700
      caption: "Digitized Sky Survey (DSS) image of the 11 million year old Upper Scorpius Star forming region. The two bright stars are Nu Scorpii (left) and Beta Scorpii (right), both likely members of Upper Scorpius. The cloudy region around Nu Scorpii is a reflection nebula; residual dust from recent star formation as well as interstellar dust is reflecting light from the bright star. A zoom-in inset is shown around the star K2-33b, with the planet host circled in red. Image credit: A. Mann, DSS/SDSS"

- id: k225
  toc: Exoplanet in the Hyades Star Cluster
  title: Exoplanet in the Hyades Star Cluster (K2-25b)
  date: 2016-02
  blurb: >-
    <p>The <a href="https://mcdonaldobservatory.org/news/releases/20160224">UT press release</a> has some basic information about the system.
    The discovery was also featured in <a href="http://www.skyandtelescope.com/astronomy-news/exoplanet-in-hyades-star-cluster-0703201623/">Sky and Telescope</a> (among other places).</p>
  media:
    - src: img/Hyades_K2-25.png
