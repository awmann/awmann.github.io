- id: IRAS
  toc: A Rare Glimpse of a Newborn Planet (TIDYE-1b)
  title: "A Rare Glimpse of a Newborn Planet (IRAS 04125+2902b or TIDYE-1b):"
  date: 2024-11
  layout: side
  media:
    - src: research_img/irasb_cropped.jpg
      alt: Artist's illustration of IRAS 04125+2902 b in front of its star, with a tilted outer disk and a faint companion star in the background
      width: 400
  blurb: >-
    <p>Our Nature paper on the 3Myr planet IRAS 04125+2902b was covered by a range of international and US outlets. This included
    <a href="https://www.reuters.com/science/fast-forming-alien-planet-has-astronomers-intrigued-2024-11-22/">Reuters,</a>
    <a href="https://science.nasa.gov/universe/exoplanets/discovery-alert-a-rare-glimpse-of-a-newborn-planet/">a NASA discovery alert,</a>
    <a href="https://www.usatoday.com/story/news/nation/2024/11/25/newborn-planet-baby-unc-astronomers-nasa-youngest/76569083007/">USA Today</a>,
    the <a href="https://apnews.com/press-release/pr-newswire/planets-99ffb13d18f7ba4c4250659671c371ea">Associated Press</a>, and an interview on
    <a href="https://abcnews.go.com/Technology/grad-study-discovers-planet-orbiting-nearby-star-astronomers/story?id=116006890">ABC</a>. UNC also did their own
    <a href="https://www.unc.edu/discover/graduate-student-discovers-youngest-transiting-planet-ever/">story</a></p>
    <p>For more information, check out the <a href="https://www.nature.com/articles/d41586-024-03741-3">Nature briefing here</a> or the
    <a href="https://www.nature.com/articles/s41586-024-08123-3">Nature article</a>. I also have a summary on <a href="irasb.html">my research page</a>.</p>
    <p>To the left is an artist rendition of the IRAS 04125+2902b system showing the planet and the outer misaligned disk. In the background, you can see
    the lower-mass companion as well as the nebulosity from the Taurus-Auriga star-forming region.</p>
    <p>Image credit: NASA/JPL-Caltech/R. Hurt, K. Miller (Caltech/IPAC).</p>

- id: featherweight
  toc: The Featherweight Giant
  title: "The Featherweight Giant:"
  date: 2024-12
  blurb: >-
    <p>Our paper on the mass of a baby planet was covered in <a href="https://www.nature.com/articles/d41586-024-04011-y">Nature research highlights</a>,
    <a href="https://skyandtelescope.org/astronomy-news/the-webb-telescope-reveals-a-featherweight-giant-planet/">Sky &amp; Telescope</a>, and by
    <a href="https://physics.unc.edu/unveiling-a-lightweight-giant-jwst-reveals-the-true-nature-of-a-young-exoplanet/">UNC Physics &amp; Astronomy</a>.
    The main piece of this story was how we figured out the mass and composition of the atmosphere from the JWST spectrum. You can read more about this work
    <a href="featherweight.html">on its research page</a>.</p>
  media:
    - src: img/hip67522b_Thao.jpg
      alt: "JWST NIRSpec transmission spectrum of HIP 67522 b showing water and carbon dioxide features"
      width: 700
      caption: "The JWST transmission spectrum of HIP 67522 b from Thao et al. (2024). Image credit: NASA/JPL-Caltech/R. Hurt (IPAC)."

- id: k233
  toc: Hazy with a chance of starspots (or rings?)
  title: Hazy with a chance of starspots (or rings?)
  date: 2022-12
  blurb: >-
    <p>A pair of articles on astrobites covering our results on the 10 Myr planet K2-33b. We found that the transit depths varied by almost a factor of two
    from the optical to the infrared. The first <a href="https://astrobites.org/2022/12/02/a-smoggy-day-on-a-young-exoplanet/">A Smoggy Day on a Young Exoplanet</a>, covered the
    <a href="https://arxiv.org/abs/2211.07728">main paper,</a> focusing on the role of atmospheric hazes and/or spots on the stellar surface. The second article
    <a href="https://astrobites.org/2022/12/01/k2-33b-rings/">Could Rings Explain an Intriguing Exoplanet Spectrum?</a> discussed an alternate explanation
    involving rings around the planet.</p>
  media:
    - src: img/ring.webp
      alt: Cartoon of how a ring changes a planet's transit radius with wavelength, in optically thick, optically thin, and ring-free regimes
      width: 700
      class: white
      caption: This cartoon shows how rings could make the planet seem much larger at optical wavelengths, where the ring is optically thick, but smaller at redder wavelengths where the disk is more transparent. Figure from <a href="https://arxiv.org/abs/2211.07706">Ohno et al. (2022)</a>.

- id: toi451
