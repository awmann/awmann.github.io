- id: hettleman
  toc: 2026 Hettleman Prize
  title: 2026 Hettleman Prize
  date: 2026-07
  layout: side
  media:
    - src: img/headshot_2026.jpg
      alt: Portrait of Andrew Mann
      width: 300
  blurb: >-
    <p>I was one of five early-career UNC faculty to receive a 2026 Hettleman Prize. You can read the
    <a href="https://www.unc.edu/posts/2026/07/14/5-early-career-faculty-win-2026-hettleman-prizes/">UNC announcement here</a>
    and the <a href="https://physics.unc.edu/andrew-mann-receives-2026-hettleman-prize/">Physics &amp; Astronomy story</a>.
