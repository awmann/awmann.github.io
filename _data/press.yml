- id: pleiades
  toc: The Greater Pleiades Complex
  title: The Greater Pleiades Complex
  date: 2025-11-12
  layout: side
  media:
    - src: research_img/pleiades_well.jpg
      alt: Looking up out of a well at a starry sky crowded with Pleiades complex stars
      width: 450
      caption: "Art: Ana Isabel Lopez Murillo."
  blurb: >-
    <p>Our discovery that the Pleiades is the core of a much larger, dissolving structure was covered by the
    <a href="https://www.nytimes.com/2025/11/12/science/astronomy-stars-pleiades.html">New York Times</a>,
    <a href="https://www.astronomy.com/science/astronomers-find-the-greater-pleiades-complex/">Astronomy</a>, and
    <a href="https://earthsky.org/space/lost-sisters-of-pleiades-gas-cloud-complex/">EarthSky</a>, and in a
    <a href="https://uncnews.unc.edu/2025/11/12/the-seven-sisters-just-found-thousands-of-long-lost-siblings/">UNC press release</a>.</p>
    <p>It was also picked up by <a href="https://phys.org/news/2025-11-pleiades-star-cluster-revealed-vast.html">Phys.org</a>,
    <a href="https://www.sciencedaily.com/releases/2025/11/251116105945.htm">ScienceDaily</a>,
    <a href="https://www.discovermagazine.com/the-seven-sisters-star-cluster-is-20-times-larger-than-we-thought-48250">Discover</a>,
    <a href="https://www.abc.net.au/news/science/2025-11-12/pleiades-seven-sisters-star-cluster-telescopes-astronomy/105993350">ABC News (Australia)</a>,
    <a href="https://interestingengineering.com/future-of-space/seven-sisters-the-pleiades-star">Interesting Engineering</a>,
    <a href="https://thedebrief.org/a-new-window-into-the-hidden-architecture-of-our-galaxy-astronomers-discover-lost-stars-concealed-among-the-seven-sisters-of-the-pleiades/">The Debrief</a>, and
    <a href="https://www.universetoday.com/articles/the-seven-sisters-have-thousands-of-hidden-siblings">Universe Today</a>.
    UNC ran a <a href="https://www.unc.edu/posts/2025/11/20/stubborn-astronomer-makes-major-lost-sisters-finding/">profile of Andy Boyle</a>,
    who led the work, and the College of Arts &amp; Sciences covered it in
    <a href="https://college.unc.edu/2025/12/capturing-the-cosmos/">Capturing the cosmos</a>.</p>
    <p>Read <a href="https://iopscience.iop.org/article/10.3847/1538-4357/ae0724">the paper (ApJ)</a> or my
    <a href="Pleiades.html">summary of the result</a>.</p>

- id: students
