- id: hip67522
  toc: Young Giant Planet Offers Clues to Formation of Exotic Worlds
  title: "HIP 67522b:"
  date: 2020-06
  blurb: >-
    <p>Our discovery of the 15 Myr planet in Sco-Cen (HIP 67522) was
    covered by <a href="https://www.universetoday.com/146739/do-hot-jupiters-form-close-in-or-do-they-migrate-a-newly-discovered-planet-might-help-answer-this/">Universe Today</a>,
    <a href="http://www.sci-news.com/astronomy/youngest-hot-jupiter-08562.html">Science News</a>, and highlighted on
    <a href="https://www.jpl.nasa.gov/news/news.php?feature=7683">JPL</a>
    and <a href="https://mcdonaldobservatory.org/news/releases/20200622">McDonald Observatory</a></p>
  media:
    - video: video/baby-hot-jupiter.mp4
      poster: video/baby-hot-jupiter_poster.jpg
      autoplay: true
      alt: Animation of a hot Jupiter orbiting close to its star
      width: 700
      caption: "Animation shows the type of gas giant planet known as a Hot Jupiter that orbits very close to its star. More young hot Jupiters like HIP 67522b can help us understand how giant planets migrate from wider orbits to their final configuration. Credit: NASA/JPL-Caltech"

