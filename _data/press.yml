  date: 2021-01
  blurb: >-
    <p>Our discovery of the TOI-451 planet was covered by
    <a href="https://www.nasa.gov/universe/nasas-tess-discovers-new-worlds-in-a-river-of-young-stars/">NASA</a>.</p>
  media:
