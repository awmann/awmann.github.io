- id: exhibit
  toc: Hidden Lives of Stars exhibit
  title: Hidden Lives of Stars (Morehead Planetarium and Science Center)
  date: 2025-11-29
  blurb: >-
    <p><em>Hidden Lives of Stars</em> is an exhibit at the
    <a href="https://moreheadplanetarium.org/explore/exhibits/">Morehead Planetarium and Science Center</a>, developed with the
